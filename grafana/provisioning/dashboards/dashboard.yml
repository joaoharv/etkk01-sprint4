# Provisiona os dashboards de grafana/dashboards/ automaticamente na subida.
apiVersion: 1

providers:
  - name: sprint4-incidentes
    orgId: 1
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
