# Config para execucao no host (ex.: dev com POSTGRES_HOST=localhost).
# Dentro do container o repo e montado por subdiretorios (tests/, src/, ...),
# entao este arquivo nao e visto la — o alvo `make test` passa as flags direto.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short -p no:cacheprovider
