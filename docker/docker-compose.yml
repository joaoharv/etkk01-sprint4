name: sprint4-incidentes-ti

# ------------------------------------------------------------
# Config comum aos servicos do Airflow (webserver, scheduler, init).
# LocalExecutor: sem Celery/Redis — suficiente para o volume deste projeto.
# ------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Conexao usada pela DAG para falar com o banco de negocio.
    AIRFLOW_CONN_POSTGRES_DEFAULT: ${AIRFLOW_CONN_POSTGRES_DEFAULT}
    # A camada ETL (src/) le estas variaveis via os.environ.
    PYTHONPATH: /opt/airflow/project
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    SOURCE_FILE_PATH: ${SOURCE_FILE_PATH}
    # SMTP do Airflow (Plano 2.1, Etapa 15) -- aponta para o Mailpit local,
    # nunca para um servidor de e-mail real. Sem usuario/senha: Mailpit nao
    # exige autenticacao.
    AIRFLOW__SMTP__SMTP_HOST: mailpit
    AIRFLOW__SMTP__SMTP_PORT: "1025"
    AIRFLOW__SMTP__SMTP_STARTTLS: "False"
    AIRFLOW__SMTP__SMTP_SSL: "False"
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${ALERTA_EMAIL_REMETENTE}
    # Lida diretamente por src/alertas/notificacoes.py (nao e' uma env do Airflow).
    ALERTA_EMAIL_DESTINATARIOS: ${ALERTA_EMAIL_DESTINATARIOS}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../src:/opt/airflow/project/src
    - ../sql:/opt/airflow/project/sql
    - ../config:/opt/airflow/project/config
    - ../tests:/opt/airflow/project/tests
    - ../data:/opt/airflow/project/data
    - ../models:/opt/airflow/project/models
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_started
  networks:
    - incidentes_net

services:
  postgres:
    image: postgres:16
    container_name: incidentes_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-airflow-db.sh:/docker-entrypoint-initdb.d/init-airflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - incidentes_net

  airflow-init:
    <<: *airflow-common
    container_name: incidentes_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: incidentes_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: incidentes_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.1.0
    container_name: incidentes_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      # Consumidas pelo datasource provisionado na Fase 8.
      POSTGRES_HOST: postgres:5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SMTP do Grafana Alerting (Plano 2.1, Etapa 15) -- Mailpit local, sem
      # autenticacao e sem TLS (mesmo servico usado pelo Airflow acima).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: ${ALERTA_EMAIL_REMETENTE}
      GF_SMTP_FROM_NAME: "Grafana Alerting - Sprint 4"
      GF_SMTP_SKIP_VERIFY: "true"
    ports:
      - "${GRAFANA_PORT_HOST:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - incidentes_net

  # Servidor SMTP local que so CAPTURA e-mails (nunca envia para a internet) --
  # usado pelo Airflow e pelo Grafana Alerting para o demo da Etapa 15, sem
  # nenhuma credencial real. UI de inspecao: http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.20.5
    container_name: incidentes_mailpit
    ports:
      - "${MAILPIT_UI_PORT_HOST:-8025}:8025"
      - "${MAILPIT_SMTP_PORT_HOST:-1025}:1025"
    restart: unless-stopped
    networks:
      - incidentes_net

volumes:
  postgres-data:
  grafana-data:
  airflow-logs:

networks:
  incidentes_net:
    name: incidentes_net
